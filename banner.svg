<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
            <stop offset="0%" stop-color="#0a0a0f" />
            <stop offset="100%" stop-color="#030305" />
        </radialGradient>
        
        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="50%" stop-color="#d4d4d8" />
            <stop offset="100%" stop-color="#71717a" />
        </linearGradient>

        <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#3b82f6" />
            <stop offset="50%" stop-color="#8b5cf6" />
            <stop offset="100%" stop-color="#ec4899" />
        </linearGradient>

        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="20" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="35" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>

        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
            <path d="M 20 0 L 20 40 M 0 20 L 40 20" fill="none" stroke="rgba(255,255,255,0.01)" stroke-width="0.5"/>
        </pattern>
    </defs>
    
    <rect width="1200" height="300" fill="url(#bgGrad)" />
    <rect width="1200" height="300" fill="url(#grid)" />

    <path d="M -100,150 C 300,350 800,-50 1300,150" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.3" filter="url(#intenseGlow)" />
    <path d="M -100,180 C 400,20 800,380 1300,100" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.2" filter="url(#glow)" />
    <path d="M 0,200 Q 600,100 1200,250 T 2400,200" fill="none" stroke="#8b5cf6" stroke-width="0.75" opacity="0.15" />

    <g transform="translate(180, 80)">
        <circle cx="0" cy="0" r="16" fill="#e34f26" filter="url(#intenseGlow)" opacity="0.5" />
        <circle cx="0" cy="0" r="6" fill="#ffffff" />
    </g>
    
    <g transform="translate(1020, 210)">
        <circle cx="0" cy="0" r="22" fill="#264de4" filter="url(#intenseGlow)" opacity="0.5" />
        <circle cx="0" cy="0" r="8" fill="#ffffff" />
    </g>

    <g transform="translate(950, 70)">
        <circle cx="0" cy="0" r="14" fill="#f7df1e" filter="url(#intenseGlow)" opacity="0.4" />
        <circle cx="0" cy="0" r="5" fill="#ffffff" />
    </g>

    <g transform="translate(600, 145)">
        <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="72" font-weight="900" fill="none" stroke="url(#accentGrad)" stroke-width="8" text-anchor="middle" filter="url(#glow)" opacity="0.6">
            TASK MANAGER
        </text>
        <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="72" font-weight="900" fill="url(#textGrad)" text-anchor="middle" filter="url(#subtleGlow)">
            TASK MANAGER
        </text>
        
        <text x="0" y="60" font-family="'Inter', -apple-system, sans-serif" font-size="20" font-weight="600" fill="#a1a1aa" text-anchor="middle" letter-spacing="12">
            2026 EDITION
        </text>

        <circle cx="-130" cy="53" r="2" fill="#ec4899" filter="url(#glow)" />
        <circle cx="130" cy="53" r="2" fill="#3b82f6" filter="url(#glow)" />
    </g>

    <rect x="0" y="298" width="1200" height="2" fill="url(#accentGrad)" filter="url(#glow)" opacity="0.8"/>
</svg>
